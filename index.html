 illness:{id:'illness',icon:'+',tag:'Soziale Sicherung · Krankheit',name:'Plötzlich schwer krank',headline:'Krank – und kein Einkommen?',teaser:'Was passiert mit dem Einkommen, wenn jemand nicht mehr arbeiten kann?',person:'Laura, 35 Jahre',story:'Laura arbeitet seit mehreren Jahren in einem Supermarkt und ist gesetzlich krankenversichert. Nach einer schweren Erkrankung kann sie voraussichtlich drei Monate nicht arbeiten. Die Miete, Lebensmittel und andere Rechnungen muss sie weiterhin bezahlen.',problemHint:'Welches Risiko entsteht, wenn Laura länger keinen Lohn bekommt?',proposalHint:'Wer könnte Laura in dieser Zeit unterstützen? Wie ließe sich das organisieren?',ruleName:'Entgeltfortzahlung und Krankengeld',ruleText:'Wer wegen Krankheit arbeitsunfähig ist, bekommt bei bestehendem Anspruch in der Regel bis zu sechs Wochen weiterhin Lohn vom Arbeitgeber. Bei längerer Arbeitsunfähigkeit kann danach die gesetzliche Krankenkasse Krankengeld zahlen. Es liegt normalerweise unter dem bisherigen Nettoeinkommen. Anspruch und Dauer hängen von gesetzlichen Voraussetzungen ab.',goal:'Einkommensausfälle durch längere Krankheit abfedern.',sourceName:'Bundesministerium für Gesundheit (BMG)',sourceUrl:'https://www.bundesgesundheitsministerium.de/krankengeld/',actors:[{name:'Laura · Arbeitnehmerin',q:'Welche Sicherheit erhält Laura durch die Absicherung?',hint:'Denke an laufende Kosten und finanziellen Druck.'},{name:'Supermarkt · Arbeitgeber',q:'Welche Kosten oder organisatorischen Aufgaben entstehen zunächst?',hint:'Denke an die erste Krankheitsphase und die Vertretung bei der Arbeit.'},{name:'Versichertengemeinschaft',q:'Was bedeutet die Absicherung für gemeinsam finanzierte Leistungen?',hint:'Viele Versicherte finanzieren Leistungen über Beiträge mit.'}],expert:'Wie sähe Lauras Situation ohne verpflichtende Absicherung aus? Entwickle eine andere Möglichkeit und beschreibe deren Grenzen.',boardProblem:'Einkommensverlust bei längerer Krankheit',boardMeasure:'Entgeltfortzahlung /  pension:{id:'pension',icon:'⌂',tag:'Soziale Sicherung · Alter',name:'Wenn die Rente nicht reicht',headline:'Ein Leben lang gearbeitet – trotzdem knapp bei Kasse?',teaser:'Wer hilft, wenn das Einkommen im Alter nicht zum Leben reicht?',person:'Frau Berger, 72 Jahre',story:'Frau Berger lebt allein. Sie hat lange gearbeitet, aber ihre monatliche Rente reicht kaum für Miete, Lebensmittel und Strom. Größere Ersparnisse hat sie nicht. Sie fragt sich, wie sie ihren Lebensunterhalt im Alter sichern soll.',problemHint:'Welche Folgen hat ein zu niedriges Einkommen für das Leben im Alter?',proposalHint:'Wie könnte eine Gesellschaft dafür sorgen, dass ältere Menschen ausreichend abgesichert sind?',ruleName:'Gesetzliche Rente und Grundsicherung im Alter',ruleText:'Die gesetzliche Rentenversicherung zahlt berechtigten Versicherten im Alter eine Rente. Reichen Einkommen und berücksichtigungsfähiges Vermögen nicht für den notwendigen Lebensunterhalt, kann unter bestimmten Voraussetzungen zusätzlich Grundsicherung im Alter beantragt werden. Über diese bedürftigkeitsabhängige Sozialleistung entscheidet das Sozialamt; sie ist keine zusätzliche Rente.',goal:'Einkommenssicherung im Alter und Schutz des notwendigen Lebensunterhalts bei Bedürftigkeit.',sourceName:'Deutsche Rentenversicherung (DRV)',sourceUrl:'https://www.deutsche-rentenversicherung.de/DRV/DE/Rente/Allgemeine-Informationen/Wissenswertes-zur-Rente/FAQs/Grundsicherung/Grundsicherung_Liste',actors:[{name:'Frau Berger · Rentnerin',q:'Wobei könnte die Grundsicherung Frau Berger helfen?',hint:'Denke an Miete, Lebensmittel und gesellschaftliche Teilhabe.'},{name:'Steuerzahlende',q:'Welche Aufgabe und Kosten entstehen für die Gemeinschaft?',hint:'Die Grundsicherung im Alter wird aus Steuermitteln finanziert.'},{name:'Erwerbstätige und Beitragszahlende',q:'Welche langfristige Herausforderung kann die Alterssicherung mit sich bringen?',hint:'Denke an die Finanzierung der Rentenversicherung und demografische Veränderungen.'}],expert:'Sollte die Grundsicherung nur bei nachgewiesenem Bedarf gezahlt werden oder alle Renten pauschal erhöhen? Vergleiche eine mögliche Folge.',boardProblem:'Altersarmut / zu wenig Einkommen',boardMeasure:'Rentenversicherung / Grundsicherung im Alter',boardGoal:'Absicherung und Existenzsicherung im Alter',boardActors:'Rentnerinnen · Beitragszahlende · Steuerzahlende'},
 consumer:{id:'consumer',icon:'▣',tag:'Verbraucherschutz · Einkauf',name:'Kaputte Kopfhörer',headline:'Neu gekauft – schon defekt?',teaser:'Müssen Käuferinnen ein mangelhaftes Produkt einfach hinnehmen?',person:'Lea, 16 Jahre',story:'Lea kauft bei einem Händler neue Kopfhörer. Schon beim ersten Einschalten funktionieren sie nicht. Lea hat nichts beschädigt. Der Händler behauptet: „Verkauft ist verkauft. Damit habe ich nichts mehr zu tun.“',problemHint:'Warum wäre Lea ohne verbindliche Käuferrechte möglicherweise benachteiligt?',proposalHint:'Welche faire Regel würdest du für mangelhafte Produkte aufstellen?',ruleName:'Gesetzliche Gewährleistungsrechte',ruleText:'Bei neu gekauften Waren muss der Verkäufer grundsätzlich für Mängel einstehen, deren Ursache bereits bei der Übergabe bestand. Zeigt sich ein solcher Mangel, können Käuferinnen in der Regel zunächst eine kostenfreie Reparatur oder Ersatzlieferung verlangen. Für Neuware gilt grundsätzlich eine zweijährige Gewährleistungsfrist; bei einer Reparatur innerhalb dieser Frist können für Kaufverträge ab dem 31. Juli 2026 verlängerte Fristen gelten.',goal:'Käuferinnen und Käufer vor mangelhaften Waren schützen und verlässliche Regeln für den Handel schaffen.',sourceName:'Verbraucherzentrale – Gewährleistung und Reparaturrecht',sourceUrl:'https://www.verbraucherzentrale.de/wissen/vertraege-reklamation/kundenrechte/recht-auf-reparatur-mehr-rechte-seit-31-juli-2026-124253',actors:[{name:'Lea · Käuferin',q:'Was verbessert sich für Lea durch die gesetzlichen Rechte?',hint:'Denke an Reparatur, Ersatz und Sicherheit beim Kauf.'},{name:'Händler',q:'Welche Pflichten und möglichen Kosten entstehen für den Händler?',hint:'Denke an die Bearbeitung berechtigter Reklamationen.'},{name:'Andere Kundschaft',q:'Welche indirekten Folgen könnten solche Rechte für den Markt haben?',hint:'Denke an Vertrauen beim Kauf und möglicherweise Kosten – keine Folge ist automatisch.'}],expert:'Entwickle eine Regel, die Käuferinnen schützt und zugleich Missbrauch durch unbegründete Reklamationen begrenzt. Welche Schwierigkeit bleibt?',boardProblem:'Mangelhafte Ware / ungleiche Verhandlungsmacht',boardMeasure:'Gesetzliche Gewährleistungsrechte',boardGoal:'Schutz der Käuferinnen und Käufer',boardActors:'Kundschaft · Händler · andere Käuferinnen'}
};
const STEPS=['Problem','Meine Idee','Deutschland','Folgen','Urteil'];
const KEY='sowi10-staatsradar-v1';
let db={};let activeCase=null;let step=0;let page='home';let modalOpen=false;let boardRevealed={};
function blank(){return {problem:'',proposal:'',unlocked:false,actors:['','',''],position:'',reason:'',expert:'',stage:0};}
function safeLoad(){try{let x=localStorage.getItem(KEY);if(x){const v=JSON.parse(x);if(v&&typeof v==='object')db=v;}}catch(e){/* The page works without storage. */}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}}
function get(id){if(!db[id])db[id]=blank();return db[id]}
function esc(t){return String(t??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
function node(){return document.getElementById('app')}
function scrollTopNow(){window.scrollTo({top:0,behavior:'instant'})}
function showHome(){page='home';activeCase=null;render();scrollTopNow()}
function showCase(id,s=0){activeCase=id;step=s;page='case';get(id);render();scrollTopNow()}
function showBoard(){page='board';render();scrollTopNow()}
function showIntro(){modalOpen=true;renderModal();}
function closeIntro(){modalOpen=false;renderModal();}
function detailIcon(x){return `<span class="iconbox" aria-hidden="true">${esc(x.icon)}</span>`}
function getProgress(id){const d=get(id);return Math.max(0,Math.min(5,Number(d.stage)||0));}
function homeHTML(){const done=Object.keys(CASES).filter(id=>getProgress(id)>=5).length;return `<section class="hero"><div class="kicker"><span class="dot"></span> SOZIALE MARKTWIRTSCHAFT · WIRTSCHAFTSRAT</div><h1>Mehr Markt<br>oder mehr Staat?</h1><p>Was passiert, wenn Menschen wirtschaftliche Schwierigkeiten erleben? Entscheide selbst, entdecke eine echte Regelung und untersuche: <strong>Wem hilft sie – und welche Folgen hat sie für andere?</strong></p><div class="hero-bottom"><button class="primary" data-action="intro">Einstiegsfrage ansehen ↗</button><span class="muted small">Ein Fall ist Pflicht · ca. 15 Minuten · eigene Meinung begründen</span></div></section><div class="sectionbar"><div><h2>Dein Fall. Deine Entscheidung.</h2><p>Wähle den Fall, der dich am meisten interessiert. Bearbeite einen davon gründlich.</p></div><span class="countpill">${done} / 4 abgeschlossen</span></div><section class="case-grid" aria-label="Wähle einen Fall">${Object.values(CASES).map(c=>`<button type="button" class="case-card" data-action="case" data-id="${c.id}">${detailIcon(c)}<h3>${esc(c.name)}</h3><p>${esc(c.teaser)}</p><div class="tail"><span>${getProgress(c.id)>=5?'✓ Abgeschlossen':getProgress(c.id)>0?'↻ Fortsetzen':'Fall untersuchen'}</span><span class="circle-arrow">→</span></div></button>`).join('')}</section><div class="meta-cards"><div><strong>1. Eigene Idee zuerst</strong><span>Die echte Regel wird erst nach deiner Überlegung gezeigt.</span></div><div><strong>2. Akteure mitdenken</strong><span>Wer profitiert? Wer trägt möglicherweise Kosten?</span></div><div><strong>3. Stellung beziehen</strong><span>Es gibt keine vorgeschriebene politische Position.</span></div></div><div class="overview-row"><button class="ghost" data-action="board">Zur gemeinsamen Sicherung →</button><span class="micro muted">Diese Übersicht wird am Ende im Plenum ausgefüllt.</span></div>`}
function progressHTML(){let percent=(step/5)*100;return `<div class="progress-wrap"><div class="progress-head"><span>DEIN WEG DURCH DEN FALL</span><strong>Schritt ${Math.min(step+1,5)} von 5</strong></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="steps-mini">${STEPS.map((t,i)=>`<span class="${i===step?'active':''}">${i+1}. ${esc(t)}</span>`).join('')}</div></div>`}
function field(name,label,placeholder,value,hint){return `<label for="${name}" class="question">${label}</label><textarea id="${name}" class="answer" name="${name}" placeholder="${esc(placeholder)}" autocomplete="off">${esc(value)}</textarea>${hint?`<details class="hint"><summary>☞ Denkhilfe anzeigen</summary><p>${esc(hint)}</p></details>`:''}`}
function caseHTML(){const c=CASES[activeCase], d=get(c.id);return `<div class="breadcrumb"><button data-action="home" type="button">← Alle Fälle</button><span class="context">${esc(c.tag)}</span></div><section class="case-hero"><div><div class="kicker"><span class="dot"></span> DER STAATSRADAR · FALLAKTE</div><h1>${esc(c.headline)}</h1><p>${esc(c.teaser)}</p></div><div class="case-emblem" aria-hidden="true">${esc(c.icon)}</div></section>${step===5?'':progressHTML()}<section class="work-card" aria-label="Arbeitsauftrag">${step===5?finishedHTML(c,d):stepHTML(c,d)}</section>`}
function stepHTML(c,d){let h=`<div class="step-kicker">Schritt ${step+1} · ${esc(STEPS[step])}</div>`;
 if(step===0){h+=`<h2>Was ist hier das Problem?</h2><div class="story"><span class="name">${esc(c.person)}.</span> ${esc(c.story)}</div>${field('problem','Beschreibe das wirtschaftliche oder soziale Problem in 1–2 Sätzen.','Das Problem ist, dass …',d.problem,c.problemHint)}`}
 if(step===1){h+=`<h2>Was würdest du verändern?</h2><p>Stell dir vor, es gäbe für diesen Fall noch keine passende staatliche Regel. Überlege zuerst selbst.</p><div class="story"><strong>Dein festgestelltes Problem:</strong><br>${esc(d.problem)}</div>${field('proposal','Entwickle eine konkrete Lösungsidee. Wer sollte was tun?','Ich würde vorschlagen, dass …',d.proposal,c.proposalHint)}`}
 if(step===2){h+=`<h2>Und wie ist das in Deutschland geregelt?</h2><p>Vergleiche deine eigene Idee mit der tatsächlichen Regelung. Sie muss nicht mit deinem Vorschlag übereinstimmen.</p><div class="callout"><div class="tag">Tatsächliche Regelung · Stand Oktober 2026</div><h3>${esc(c.ruleName)}</h3><p>${esc(c.ruleText)}</p><div class="factlist"><div><b>→</b><span><strong>Ziel:</strong> ${esc(c.goal)}</span></div></div><div class="source">Nachlesen: <a target="_blank" rel="noopener noreferrer" href="${esc(c.sourceUrl)}">${esc(c.sourceName)} ↗</a></div></div><p><strong>Vergleiche:</strong> Was ähnelt deiner eigenen Idee? Was ist anders?</p><details class="hint"><summary>☞ Was bedeutet „staatlicher Eingriff“ hier?</summary><p>Es kann sich um ein Gesetz, eine verbindliche Verpflichtung oder um ein staatlich geregeltes Sicherungssystem handeln – nicht immer um eine direkte Zahlung des Staates.</p></details>`}
 if(step===3){h+=`<h2>Wem hilft die Regel – und welche Folgen könnte sie haben?</h2><p>Untersuche mindestens <strong>zwei unterschiedliche Beteiligte</strong>. Denk daran: Eine mögliche Folge muss nicht in jedem Fall eintreten.</p><div class="actor-list">${c.actors.map((a,i)=>`<div class="actor"><h3>${i===0?'↗':i===1?'↔':'◇'} ${esc(a.name)} ${i===2?'<span class="optional-label">freiwillig</span>':''}</h3><p>${esc(a.q)}</p><textarea class="answer" data-actor="${i}" aria-label="Antwort: ${esc(a.name)}" placeholder="Deine Erklärung in 1–2 Sätzen …">${esc(d.actors[i])}</textarea><details class="hint"><summary>☞ Denkimpuls</summary><p>${esc(a.hint)}</p></details></div>`).join('')}</div><p class="small muted">Fachlicher Hinweis: Kosten sind nicht automatisch ein Argument gegen eine Maßnahme. Entscheidend ist, welche Folgen sie insgesamt haben kann.</p>`}
 if(step===4){h+=`<h2>Mehr Markt oder mehr Staat?</h2><p>Jetzt kennst du eine tatsächliche Regelung und hast mögliche Folgen betrachtet. <strong>Wie viel staatliches Eingreifen hältst du in deinem Fall für sinnvoll?</strong></p><fieldset style="border:0;padding:0;margin:0"><legend class="question">Wähle deine Position.</legend><div class="positions">${[['market','←','Eher mehr Markt & Eigenverantwortung'],['mixed','⇄','Kombination aus Markt & Regeln'],['state','→','Eher mehr staatliche Regeln & Absicherung']].map(([v,i,t])=>`<label class="position"><input type="radio" name="position" value="${v}" ${d.position===v?'checked':''}><span class="tile"><span class="symbol">${i}</span>${t}</span></label>`).join('')}</div></fieldset>${field('reason','Begründe dein Urteil in 2–3 Sätzen. Beziehe dich auf eine mögliche Folge für Beteiligte.','In diesem Fall finde ich … sinnvoll, weil … Andererseits …',d.reason,'Satzanfänge: „Ich entscheide mich für …, weil …“ / „Für … ist das hilfreich, aber für … könnte …“')}`}
 const back=step>0?`<button class="secondary" type="button" data-action="prev">← Zurück</button>`:`<button class="secondary" data-action="home" type="button">← Fallauswahl</button>`;
 h+=`<div class="buttons">${back}<div class="right"><button class="primary" type="button" id="continue" data-action="next">${step===0?'Meine Lösung entwickeln →':step===1?'Tatsächliche Regelung entdecken →':step===2?'Folgen untersuchen →':step===3?'Stellung nehmen →':'Stellungnahme abschließen ✓'}</button></div></div><div class="validation" id="validation" role="status"></div>`;return h;}
function finishedHTML(c,d){const label={market:'Eher mehr Markt & Eigenverantwortung',mixed:'Kombination aus Markt & Regeln',state:'Eher mehr staatliche Regeln & Absicherung'}[d.position]||'—';return `<div class="completion">✓ Fall untersucht</div><h2>Dein Ermittlungsbericht</h2><p>Du hast eine eigene Lösung entwickelt, die echte Regelung kennengelernt und Folgen für Beteiligte untersucht. Hier ist deine Zusammenfassung.</p><div class="summary"><section><h3>Das Problem</h3><p>${esc(d.problem)}</p></section><section><h3>Mein ursprünglicher Vorschlag</h3><p>${esc(d.proposal)}</p></section><section><h3>Tatsächliche Regelung und Ziel</h3><p><strong>${esc(c.ruleName)}</strong>: ${esc(c.goal)}</p></section><section><h3>Folgen für verschiedene Beteiligte</h3>${c.actors.map((a,i)=>d.actors[i].trim()?`<p style="margin:0 0 7px"><strong>${esc(a.name)}:</strong> ${esc(d.actors[i])}</p>`:'').join('')}</section><section><h3>Meine Stellungnahme: ${esc(label)}</h3><p>${esc(d.reason)}</p></section></div><div class="summary-actions"><button class="primary" data-action="print">⎙ Ermittlungsbogen drucken / als PDF</button><button class="secondary" data-action="download">↓ Textdatei speichern</button><button class="secondary" data-action="copy">⧉ Text kopieren</button></div><div class="adv-box"><div class="tag">EXPERTENAUFTRAG · FREIWILLIG</div><h3>Noch einmal kritisch denken</h3><p>${esc(c.expert)}</p><textarea name="expert" class="answer" placeholder="Meine vertiefte Überlegung …">${esc(d.expert)}</textarea></div><div class="buttons"><button class="secondary" data-action="edit">← Antworten überarbeiten</button><div class="right"><button class="primary" data-action="home">Einen anderen Fall wählen →</button></div></div><p class="small muted" style="margin-top:15px">Für die gemeinsame Sicherung werden die Ergebnisse zu vier Eingriffsbereichen im Unterricht zusammengeführt.</p>`}
function boardHTML(){return `<div class="breadcrumb"><button data-action="home">← Zur Fallauswahl</button><span class="context">Plenum · Lehrkraftansicht</span></div><section class="hero"><div class="kicker"><span class="dot"></span> GEMEINSAME SICHERUNG</div><h1>Was tut der Staat – und warum?</h1><p>Wir ordnen die vier Fälle. Zu jedem Fall werden das Problem, die tatsächliche Regelung und ihr Ziel gesammelt. Erst danach betrachten wir ausgewählte Folgen.</p></section><section class="work-card" style="max-width:none;margin-top:18px"><div class="teacher-controls"><button class="secondary" data-action="boardall">Alle Ergebnisse einblenden</button><button class="secondary" data-action="boardreset">Tafelbild zurücksetzen</button></div><div class="board-grid"><table><thead><tr><th>Problem</th><th>Staatliche Regel / Maßnahme</th><th>Ziel</th><th>Beteiligte</th></tr></thead><tbody>${Object.values(CASES).map(c=>`<tr><td>${esc(c.boardProblem)}</td><td>${boardRevealed[c.id]?esc(c.boardMeasure):`<button class="show-btn" data-action="boardreveal" data-id="${c.id}">Aufdecken</button>`}</td><td>${boardRevealed[c.id]?esc(c.boardGoal):'<span class="board-hide">Noch offen</span>'}</td><td>${boardRevealed[c.id]?esc(c.boardActors):'<span class="board-hide">Noch offen</span>'}</td></tr>`).join('')}</tbody></table></div><div class="board-quote">Staatliche Eingriffe sollen wirtschaftliche und soziale Probleme begrenzen. Sie können aber unterschiedliche Folgen für verschiedene Beteiligte haben.</div><h2 style="margin:24px 0 8px">Vertiefung im Unterrichtsgespräch</h2><p><strong>Zurück zum Mindestlohn:</strong> Wer profitiert von der Lohnuntergrenze? Welche mögliche Belastung kann für kleine Betriebe entstehen? Bedeutet das automatisch, dass die Regel schlecht ist?</p><p class="muted small">Offene Frage für die nächste Doppelstunde: <strong>Wie entscheiden wir, ob ein staatlicher Eingriff insgesamt sinnvoll ist?</strong></p></section>`}
function render(){if(page==='home')node().innerHTML=homeHTML();else if(page==='case')node().innerHTML=caseHTML();else if(page==='board')node().innerHTML=boardHTML();refresh();}
function validNext(){if(page!=='case')return false;let d=get(activeCase);if(step===0)return d.problem.trim().length>=6;if(step===1)return d.proposal.trim().length>=6;if(step===2)return true;if(step===3)return d.actors[0].trim().length>=6&&d.actors[1].trim().length>=6;if(step===4)return !!d.position&&d.reason.trim().length>=12;return true;}
function refresh(){const btn=document.getElementById('continue');if(btn)btn.disabled=!validNext();const v=document.getElementById('validation');if(v&&page==='case'&&step!==5){if(!validNext())v.textContent=step===3?'Beantworte die Fragen zu den ersten beiden Beteiligten.':step===4?'Wähle eine Position und begründe sie in vollständigen Sätzen.':step===2?'':'Beantworte die Frage, bevor du weitergehst.';else v.textContent='';}}
function stepNext(){if(!validNext())return;const d=get(activeCase);if(step===1)d.unlocked=true;step=Math.min(step+1,5);d.stage=Math.max(Number(d.stage)||0,step);save();render();scrollTopNow()}
function handleInput(el){if(page!=='case')return;const d=get(activeCase);if(el.name==='problem'||el.name==='proposal'||el.name==='reason'||el.name==='expert')d[el.name]=el.value;else if(el.dataset.actor!==undefined)d.actors[+el.dataset.actor]=el.value;else if(el.name==='position')d.position=el.value;save();refresh();}
function asText(id){const c=CASES[id],d=get(id);return ['STAATSRADAR – Mein Ermittlungsbogen','Fall: '+c.name,'','1. Problem:',d.problem,'','2. Mein Vorschlag:',d.proposal,'','3. Tatsächliche Regelung: '+c.ruleName,'Ziel: '+c.goal,'', '4. Folgen für verschiedene Beteiligte:', ...c.actors.map((a,i)=>a.name+': '+(d.actors[i]||'(nicht bearbeitet)')),'','5. Meine Position: '+({market:'Eher mehr Markt',mixed:'Kombination aus Markt und staatlichen Regeln',state:'Eher mehr Staat'}[d.position]||'–'),'Begründung:',d.reason,d.expert?'':'',d.expert?'Expertenauftrag: '+d.expert:'','Quelle: '+c.sourceName+' – '+c.sourceUrl].join('\n');}
function buildPrint(id){const c=CASES[id],d=get(id);document.getElementById('printSheet').innerHTML=`<h1>STAATSRADAR · Ermittlungsbogen</h1><div class="print-meta">Sozialwissenschaften · Klasse 10 &nbsp; | &nbsp; Name: __________________________________ &nbsp; Datum: __________</div><div class="print-meta"><strong>Fall:</strong> ${esc(c.name)}</div><section><h2>1. Das Problem</h2><p>${esc(d.problem)}</p></section><section><h2>2. Mein ursprünglicher Lösungsvorschlag</h2><p>${esc(d.proposal)}</p></section><section><h2>3. Tatsächliche Regelung</h2><p><strong>${esc(c.ruleName)}</strong> – Ziel: ${esc(c.goal)}</p></section><section><h2>4. Folgen für verschiedene Beteiligte</h2>${c.actors.map((a,i)=>`<p><strong>${esc(a.name)}:</strong> ${esc(d.actors[i]||'(nicht bearbeitet)')}</p>`).join('<div style="height:3mm"></div>')}</section><section><h2>5. Meine Stellungnahme – Mehr Markt oder mehr Staat?</h2><p>${esc(({market:'Eher mehr Markt und Eigenverantwortung',mixed:'Eine Kombination aus Markt und staatlichen Regeln',state:'Eher mehr staatliche Regeln und Absicherung'}[d.position]||''))}</p><p>${esc(d.reason)}</p></section>${d.expert?`<section><h2>Expertenauftrag</h2><p>${esc(d.expert)}</p></section>`:''}<div class="print-bottom print-small">Quelle zur Regelung: ${esc(c.sourceName)} · ${esc(c.sourceUrl)}</div>`;}
function downloadText(){const c=CASES[activeCase];const blob=new Blob([asText(activeCase)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Staatsradar_'+c.id+'_Ermittlungsbogen.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Textdatei gespeichert.');}
async function copyText(){let txt=asText(activeCase);try{await navigator.clipboard.writeText(txt);toast('Ermittlungsbogen kopiert.')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();let ok=document.execCommand('copy');ta.remove();toast(ok?'Ermittlungsbogen kopiert.':'Kopieren hier nicht möglich – nutze „Textdatei speichern“.')}}
function toast(msg){const n=document.getElementById('toastSlot');n.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>n.innerHTML='',2900)}
function renderModal(){document.getElementById('modalSlot').innerHTML=modalOpen?`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="introHeading"><div class="modal-top"><span class="kicker"><span class="dot"></span> GEDANKENEXPERIMENT · FIKTIV</span><button class="close" type="button" data-action="close">✕ Schließen</button></div><h2 id="introHeading">Wer soll festlegen, wie wenig ein Café zahlen darf?</h2><div class="split"><div class="extreme market"><span class="tag">Szenario A</span><h3>Keine gesetzliche Lohnuntergrenze</h3><div class="huge">7 €</div><p>Ein Café bietet nur 7 € brutto pro Stunde. Eine Mitarbeiterin braucht die Arbeit dringend.</p></div><div class="extreme state"><span class="tag">Szenario B</span><h3>Sehr hohe gesetzliche Lohnuntergrenze</h3><div class="huge">30 €</div><p>Ein Café müsste mindestens 30 € brutto pro Stunde zahlen – unabhängig von seiner wirtschaftlichen Lage.</p></div></div><div class="intro-question">Welche Probleme könnten in beiden Situationen entstehen?</div><p class="small muted" style="margin:13px 0">Beide Zahlen sind bewusst fiktive Extreme. Der gesetzliche Mindestlohn in Deutschland beträgt seit Januar 2026 tatsächlich 13,90 € brutto pro Stunde.</p><div class="summary-actions"><button class="primary" data-action="close">Weiter zur Fallauswahl →</button><button class="secondary" data-action="close">Schließen</button></div></div></div>`:'';if(modalOpen)document.querySelector('.close')?.focus()}
function action(el){const a=el.dataset.action;if(!a)return;if(a==='home')showHome();if(a==='intro')showIntro();if(a==='close')closeIntro();if(a==='board')showBoard();if(a==='case'){const id=el.dataset.id;if(CASES[id])showCase(id,getProgress(id)>=5?5:Math.max(0,getProgress(id)));}if(a==='next')stepNext();if(a==='prev'){step=Math.max(0,step-1);render();scrollTopNow()}if(a==='edit'){step=0;render();scrollTopNow()}if(a==='download')downloadText();if(a==='copy')copyText();if(a==='print'){buildPrint(activeCase);window.print()}if(a==='boardall'){Object.keys(CASES).forEach(k=>boardRevealed[k]=true);render()}if(a==='boardreset'){boardRevealed={};render()}if(a==='boardreveal'){boardRevealed[el.dataset.id]=true;render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)action(b);if(e.target.id==='modalBackdrop')closeIntro()});document.addEventListener('input',e=>{if(e.target.matches('textarea'))handleInput(e.target)});document.addEventListener('change',e=>{if(e.target.matches('input[name=position]'))handleInput(e.target)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen)closeIntro()});document.getElementById('brandHome').addEventListener('click',showHome);document.getElementById('openIntro').addEventListener('click',showIntro);document.getElementById('openBoard').addEventListener('click',showBoard);
safeLoad();render();
</script>
</body>
</html>
